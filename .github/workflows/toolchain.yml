name: toolchain

# The RISC-V toolchain for an aarch64 host. riscv-collab/riscv-gnu-toolchain publishes its nightly toolchains for
# x86_64 hosts only; setup/versions.env downloads riscv-collab's riscv64-elf-ubuntu-22.04-llvm on x86_64 and, on
# aarch64, the asset this workflow builds from the same riscv-collab tag the way riscv-collab builds that one:
# newlib, rv64gc/lp64d, --enable-llvm, prefix /mnt/riscv, on ubuntu 22.04 with its .github/setup-apt.sh packages.
# Dispatch only; published as release riscv-gnu-toolchain-<tag> of this repository.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: riscv-collab/riscv-gnu-toolchain release tag to build (e.g. 2026.08.27)
        type: string
        required: true

concurrency:
  group: toolchain-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, slurm, big, aarch64]
    timeout-minutes: 300
    permissions:
      contents: write
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      TAG: ${{ inputs.tag }}
      ASSET: riscv64-elf-ubuntu-22.04-llvm-aarch64.tar.xz

    steps:
      # riscv-collab's .github/setup-apt.sh, plus xz-utils and file for the packaging. The runner's containers map
      # one uid, so apt cannot switch to its sandbox user.
      - name: Install the build dependencies
        run: |
          set -euo pipefail
          echo 'APT::Sandbox::User "root";' > /etc/apt/apt.conf.d/99-no-sandbox
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates \
            autoconf automake autotools-dev curl python3 python3-pip \
            python3-tomli libmpc-dev libmpfr-dev libgmp-dev gawk \
            build-essential bison flex texinfo gperf libtool patchutils bc \
            zlib1g-dev libexpat-dev git meson ninja-build cmake libglib2.0-dev \
            expect device-tree-compiler python3-pyelftools libslirp-dev \
            libzstd-dev libncurses-dev xz-utils file

      # Only the submodules a newlib toolchain with LLVM is built from.
      - name: Check out riscv-gnu-toolchain ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$TAG" https://github.com/riscv-collab/riscv-gnu-toolchain.git src
          git -C src submodule update --init --depth 1 -j 8 binutils gcc gdb newlib llvm
          git -C src submodule status

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p /mnt/riscv
          cd src
          ./configure --prefix=/mnt/riscv --with-arch=rv64gc --with-abi=lp64d --enable-llvm
          make -j "$(nproc)" newlib

      # What riscv-collab's tarball step does: hard-link duplicates, one top-level riscv/.
      - name: Package
        run: |
          set -euo pipefail
          /mnt/riscv/bin/riscv64-unknown-elf-gcc --version | head -n 1
          /mnt/riscv/bin/clang --version | head -n 1
          file /mnt/riscv/bin/riscv64-unknown-elf-gcc
          src/.github/dedup-dir.sh /mnt/riscv/
          XZ_OPT="-e -T0" tar -cJf "$ASSET" -C /mnt riscv/
          sha256sum "$ASSET" | tee "$ASSET.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: riscv-gnu-toolchain-${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RISC-V toolchain ${{ inputs.tag }} for aarch64 hosts
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          body: |
            riscv-collab/riscv-gnu-toolchain ${{ inputs.tag }} built for an aarch64 Linux host by
            .github/workflows/toolchain.yml: newlib, rv64gc/lp64d, --enable-llvm, prefix /mnt/riscv,
            ubuntu 22.04 -- the configuration of riscv-collab's riscv64-elf-ubuntu-22.04-llvm, which
            riscv-collab publishes for x86_64 hosts only. Unpacks to riscv/.
