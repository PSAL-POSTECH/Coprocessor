name: test

# Build this repository in the environment image and run every test on both simulators.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  test:
    needs: image
    runs-on: [self-hosted, slurm, x86_64]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: scripts/build.sh

      - name: Test on Spike and gem5
        run: tests/run.sh

      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: simulator-logs
          path: build/*.log
          retention-days: 7

  # After main's environment image is published and its tests pass, PTB (PSAL-POSTECH/PyTorchSim-Triton-Backend), whose
  # images are FROM that environment, gets a pull request moving its third_party/vcix-accelerator submodule here: one
  # branch (bot/vcix-bump) force-pushed from PTB main, one open pull request, the newest main commit winning. A newer
  # run cancels an older one. Needs the PTB_BUMP_TOKEN secret, which can push to PTB and open pull requests there; this
  # workflow's own token reads this repository and its image.
  ptb-bump:
    needs: [image, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, slurm, x86_64]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ubuntu:22.04
    concurrency:
      group: ptb-bump
      cancel-in-progress: true
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # The runner's containers map one uid, so apt cannot switch to its sandbox user.
      - name: Install the tools
        run: |
          echo 'APT::Sandbox::User "root";' > /etc/apt/apt.conf.d/99-no-sandbox
          apt-get update
          apt-get install -y --no-install-recommends curl jq git ca-certificates

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Propose the submodule bump to PTB
        shell: bash
        env:
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTB_TOKEN: ${{ secrets.PTB_BUMP_TOKEN }}
          NEW: ${{ github.sha }}
        run: |
          if [ -z "$PTB_TOKEN" ]; then echo "::error::the PTB_BUMP_TOKEN secret is not set: no submodule bump for PTB"; exit 1; fi
          .github/ptb_bump.sh
